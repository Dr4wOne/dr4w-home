  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@types/node': 24.19.2
  '@types/qrcode': 1.5.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/ws': 8.18.2
  '@vitejs/plugin-react': 6.3.0
  hono: 4.13.18
  jsdom: 30.1.2
  qrcode: 1.5.4
  react: 19.3.1
  reflect-metadata: 0.2.2
  react-dom: 19.3.1
