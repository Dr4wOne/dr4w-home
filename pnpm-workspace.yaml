packages:
  - packages/*
  - apps/*

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  workerd: true

# One version of each shared dependency. Same versions as the dr4w monorepo where both use a package.
