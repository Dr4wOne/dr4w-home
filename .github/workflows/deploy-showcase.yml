name: deploy-showcase

# Deploys the static showcase (demo mode only, no backend) to Cloudflare on every push to main.
# Only the owner's repository has the `production` environment and its secrets; on forks this
# job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-showcase
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    if: github.repository == 'Dr4wOne/dr4w-home'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@dr4w-home/showcase
      - name: wrangler deploy (static assets only)
        working-directory: apps/showcase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Smoke test (the first deploy waits for the certificate)
        run: |
          for i in $(seq 1 60); do
            curl -sSf -o /dev/null https://home.dr4w.io/ && { echo "home.dr4w.io is up"; exit 0; }
            sleep 10
          done
          echo "home.dr4w.io did not answer within 10 minutes"; exit 1
